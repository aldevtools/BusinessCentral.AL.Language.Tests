name: AL Language Test Suite

# Runs the AL language coverage suite against a BC service tier on the newest
# minor of each supported major (27.5, 28.5, 29.0). al-runtime-rs
# (StefanMaron/al-runtime-rs) reads the JUnit files of these legs as its oracle.
# The bc_version input runs one other minor on request.
# All matrix legs boot BC on Linux (no Windows runner required) via
# StefanMaron/MsDyn365Bc.On.Linux.
#
# Adding a new BC version:
#   1. In the prepare job, add an include entry to the else-branch JSON:
#      {"bc_version":"29.0","runtime":"18.0","preprocessor_symbols":"BC27PLUS,BC28PLUS,BC29PLUS"}
#   2. If new API/keywords only exist from that version, guard tests with
#      #if BC29PLUS and define the symbol in the include entry above.
#   al_tool_version and runtime_version are auto-derived from bc_version
#   by the bc-linux reusable workflow — no manual entry needed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bc_version:
        description: 'Override BC version (e.g. 28.1). Runs only that version when set.'
        required: false
        default: ''
      select_base:
        description: 'Run only the tests affected by the diff from this commit or branch to the dispatched ref (see CONTRIBUTING.md, "Test selection in CI"). Empty runs everything.'
        required: false
        default: ''
      select_codeunits:
        description: 'Run only these test codeunits, a JSON object {"tests/al-language":"50010,50012..50015"} (see CONTRIBUTING.md, "Test selection in CI"). Takes precedence over select_base. Empty: select_base decides.'
        required: false
        default: ''

# Supersede a run that no longer answers a question anyone is asking.
#
# WHY. This workflow had no concurrency control at all, so every push queued a fresh eight-leg
# matrix and nothing ever cancelled the one it replaced. Measured on 2026-09-05: four PRs merged
# in a row started four full master runs, none superseded — 32 legs where 8 would do. Three had
# to be cancelled by hand. GitHub Actions concurrency is per ACCOUNT, not per repository, so
# those legs also sit in front of the other workflows of the account.
#
# THE GROUP KEY includes the event name as well as the ref, which is one step beyond the usual
# `workflow-ref` pairing, and it is load-bearing here rather than decorative:
#
#   * pull_request  -> refs/pull/<n>/merge, already unique per PR.
#   * push          -> refs/heads/master. This is the project's health check: a green master run
#                      is the signal that the corpus still matches what a real BC service tier
#                      does.
#   * workflow_dispatch on master would otherwise share the push group and could CANCEL that
#     health-check run. A manual dispatch is normally someone bisecting a red master with the
#     bc_version override; killing the automatic run to serve it, or the reverse, loses the one
#     answer that was wanted. Separating them keeps both.
#
# CANCEL-IN-PROGRESS IS TRUE FOR MASTER TOO, and that is a real trade, stated plainly: with
# four merges in a row only the last master run finishes, so a red leg says "one of the last few
# merges did it" rather than naming one. Three things make that the better deal here:
#
#   * The verdict it replaces did not exist. Queued behind an account-wide backlog, those runs
#     report on a tree nobody has any more — the state this repository was actually in a few
#     minutes before this file changed.
#   * The one cross-PR interaction that genuinely escapes per-PR CI — two PRs declaring the same
#     object id — is checked DIRECTLY by the object-ids job below, per PR against every other
#     open PR and again as an advisory sweep on master. That gate does not depend on per-commit
#     master runs. (Worth being honest about the limit: this repository does not require branches
#     to be up to date, so a PR's green is not a guarantee about master for anything the object-id
#     check does not cover.)
#   * Recovering the per-commit answer costs one workflow_dispatch on a branch pointing at the
#     suspect commit — precisely the run the group key above protects from the next merge.
#
# This changes no job's `if:` and adds no skips. The required checks of the master ruleset are
# the `BC <version> / test`, `BC OnPrem <version> / test` and `BC OnPrem DotNet <version> / test`
# legs for 27.5, 28.5 and 29.0, plus the object-id gate; a cancelled run reports them as cancelled, never as
# skipped, so a superseded run can never satisfy a required check. ci.yml is the only workflow
# registered here (the object-id gate is a job inside it), so this block covers everything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every self-test under .github/scripts/, discovered BY GLOB rather than named.
  #
  # WHY GLOB. A new self-test that has to be added to this file by hand is a new
  # self-test that gates from the day someone remembers, not the day it lands. The
  # trade is that searching this workflow for a test's filename finds nothing, which
  # is NOT evidence the test is un-gated -- so the loop prints every file it runs.
  #
  # WHY IT REFUSES AN EMPTY LIST. A glob that matches nothing exits 0 and prints
  # nothing, which is indistinguishable from "everything passed". That failure shape
  # is exactly what a gate must not have.
  script-self-tests:
    name: .github/scripts self-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run every .github/scripts/test-*.py
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(.github/scripts/test-*.py)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no .github/scripts/test-*.py found. Either the self-tests were deleted or this glob stopped matching; refusing to report a green on zero suites."
            exit 1
          fi
          echo "discovered ${#suites[@]} suite(s):"
          printf '  %s\n' "${suites[@]}"
          for s in "${suites[@]}"; do
            echo "::group::$s"
            python3 "$s"
            echo "::endgroup::"
          done

  object-ids:
    # Fast gate, seconds not minutes: two PRs can each declare the SAME object id,
    # each compile green in isolation, and break master the moment both merge --
    # neither PR's own CI can see the other. Branch protection's "require branches
    # to be up to date" used to catch that as a side effect, by forcing the second
    # PR to be rebased onto the first and recompiled. This checks it directly, so
    # that setting is no longer load-bearing and corpus PRs need not be serialized.
    name: Object IDs must be unique and in range
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The cross-PR step below needs master's history to work out which ids
          # each PR actually INTRODUCES, as opposed to inherits.
          fetch-depth: 0

      # Proves the cross-PR detector still detects. Its interesting path only
      # fires when two open PRs genuinely collide, which is rare, so without
      # this it would report "no collisions" whether or not it still worked.
      - name: Self-test the cross-PR detector
        run: python3 .github/scripts/test-cross-pr-object-ids.py

      # This tree against master, and against itself.
      - run: python3 .github/scripts/check-object-ids.py .

      # An install/upgrade trigger that raises breaks the publish of the corpus app on every BC version.
      - run: python3 .github/scripts/test-install-triggers.py
      - run: python3 .github/scripts/check-install-triggers.py .

      # This PR against every OTHER open PR. Blocking: two PRs that each add the
      # same id both pass the step above, and break master on the second merge.
      - name: Cross-PR object id collisions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          BASE_REF=origin/${{ github.event.pull_request.base.ref }} \
            python3 .github/scripts/check-cross-pr-object-ids.py

      # Every open PR against every other, after master moved. NON-blocking on
      # purpose: a collision between two open PRs is not this merge commit's
      # fault, and a red master costs more than the annotation is worth. It runs
      # here so the collision is visible even when neither PR pushes again.
      - name: Cross-PR object id collisions (advisory sweep)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }} || true
          BASE_REF=origin/${{ github.ref_name }} \
            python3 .github/scripts/check-cross-pr-object-ids.py

  prepare:
    # Gated on object-ids so a duplicate/out-of-range id never spends the BC matrix.
    # An id collision does eventually surface as AL0297 inside each leg, but that is
    # 8 parallel BC boots and ~8 minutes per leg to learn something a 2-second scan
    # already knows. Failing here means the matrix is never dispatched at all.
    needs: object-ids
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      # {test app dir: "id,id,..."}: the test codeunits each test job runs. {} (or a missing key) = the job's full
      # codeunit_range. The job names and the required checks do not change; only the codeunits each leg runs.
      subset: ${{ steps.select.outputs.subset || '{}' }}
    steps:
      # depth 2: a pull request's merge commit and its first parent, the base branch the diff is taken from
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Test selection (CONTRIBUTING.md, "Test selection in CI"). "Run AL tests" is about 21 of the 26 minutes of a
      # BC leg, so a pull request runs only the test codeunits its change can affect; .github/scripts/select-tests.py
      # decides which, or falls back to a full run, and writes why into this job's summary. Always a full run: a push
      # (master), a corpus bump pull request (head al-runtime-rs-staging), a pull request with the label full-run, and
      # a manual dispatch without select_base. A failure of this step also means a full run, never a red check.
      # A dispatch with select_codeunits (the corpus CI batcher: the union of the selections of the branches it merged,
      # because the merged diff has too many files to select from) runs that list as it is; select_base is then ignored.
      - id: select
        name: Select the test codeunits to run
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELED_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-run') }}
          SELECT_BASE: ${{ github.event.inputs.select_base }}
          SELECT_CODEUNITS: ${{ github.event.inputs.select_codeunits }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FULL='' BASE='' GIVEN=''
          case "$EVENT" in
            pull_request)
              # labels from the API, not only the event payload: "Re-run all jobs" after adding the label then works
              LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' 2>/dev/null || true)
              if [ "$HEAD_REF" = "al-runtime-rs-staging" ]; then FULL='corpus bump pull request (head branch al-runtime-rs-staging): always a full run'
              elif [ "$LABELED_FULL" = "true" ] || grep -qx 'full-run' <<< "$LABELS"; then FULL='the pull request has the label full-run'
              else BASE=$(git rev-parse HEAD^1); fi ;;
            workflow_dispatch)
              if [ -n "${SELECT_CODEUNITS:-}" ]; then GIVEN=1
              elif [ -z "$SELECT_BASE" ]; then FULL='manual run without select_base: always a full run'
              elif git fetch --no-tags --quiet --depth=1 origin "$SELECT_BASE"; then BASE=$(git rev-parse FETCH_HEAD)
              else FULL="select_base $SELECT_BASE could not be fetched"; fi ;;
            *) FULL="$EVENT on $GITHUB_REF: always a full run" ;;
          esac
          if [ -n "$FULL" ]; then
            python3 .github/scripts/select-tests.py --full-reason "$FULL" --github
          elif [ -n "$GIVEN" ]; then
            python3 .github/scripts/select-tests.py --codeunits "$SELECT_CODEUNITS" --github
          else
            python3 .github/scripts/select-tests.py --base "$BASE" --head HEAD --github
          fi || { echo "::warning title=Test selection::select-tests.py failed; every test runs"; echo 'subset={}' >> "$GITHUB_OUTPUT"; }

      - id: set
        run: |
          OVERRIDE='${{ github.event.inputs.bc_version }}'
          if [ -n "$OVERRIDE" ]; then
            MAJOR=$(echo "$OVERRIDE" | cut -d. -f1)
            SYMS=""
            for v in 27 28 29; do
              [ "$v" -le "$MAJOR" ] || break
              SYMS="${SYMS:+$SYMS,}BC${v}PLUS"
            done
            case "$MAJOR" in 27) RT=16.1;; 28) RT=17.1;; *) RT=18.0;; esac
            JSON=$(python3 -c "import json; print(json.dumps({'include':[{'bc_version':'$OVERRIDE','runtime':'$RT','preprocessor_symbols':'$SYMS'}]}))")
          else
            # The newest minor of each major: al-runtime-rs reads these legs as its oracle.
            # Use the bc_version input to run another minor.
            JSON='{"include":[{"bc_version":"27.5","runtime":"16.1","preprocessor_symbols":"BC27PLUS"},{"bc_version":"28.5","runtime":"17.1","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"29.0","runtime":"18.0","preprocessor_symbols":"BC27PLUS,BC28PLUS,BC29PLUS"}]}'
          fi
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  test:
    name: BC ${{ matrix.bc_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Workflow and scripts pinned for corpus bump 63 to bc-linux 65f6b26: a write into a missing folder fails with
    # InvalidPath as on Windows (#189). Bump 62 pin 84291ff before: fr-FR group separator U+00A0 on BC 27/28 as on
    # Windows (#174); DotNet System.IO sees the files AL File wrote under the user folder and returns paths with '\'
    # (#175, #181); MediaSet.ImportFile stores the bare file name (#176); Directory/DirectoryInfo listings match patterns
    # case-insensitively and list in name order (#183). Earlier: #165, #166, #167.
    uses: aldevtools/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@65f6b26bbc5041a567790812773522accfae5473
    with:
      bc_linux_ref:         "65f6b26bbc5041a567790812773522accfae5473"
      runner_image:         "ghcr.io/aldevtools/msdyn365bc.on.linux/bc-runner:rdlc-65f6b26bbc5041a567790812773522accfae5473"
      bc_version:           ${{ matrix.bc_version }}
      bc_country:           "w1"
      # Dependency apps of al-language, in publish order (an app after the apps it depends on). The cross-app fixtures
      # (CONTRIBUTING.md, "Multi-app fixtures") hold no tests: al-language depends on A, B and C, and their app ids, names and publishers are
      # chosen for the cross-app subscriber order probe. D depends on A only and nothing depends on D; it is published right after A,
      # before B, on purpose (subscriber order of apps that do not depend on each other). Every job that compiles al-language lists
      # them, in this order.
      app_dirs: |
        tests/al-language-internals-fixture
        tests/al-language-xapp-a
        tests/al-language-xapp-d
        tests/al-language-xapp-b
        tests/al-language-xapp-c
      test_app_dirs:        "tests/al-language"
      # The quoted range after || is this job's full range. Every job's full range is 50000..99999, every id a test app
      # can use, so a new id block never needs an edit here (the runner reads the Subtype = Test codeunits of the test
      # app's own .app and intersects them with this range; the other apps' ids in the span cost nothing). Left out:
      # 75020..75024, Subtype = Test codeunits WITHOUT test methods (fixtures whose TestType and RequiredTestIsolation
      # metadata codeunit/lt-x-object-props/XObjectProps.al reads); a codeunit in the range that reports no result at all
      # fails the leg ("5 codeunit(s) produced NO result", run 39203765648). On a pull request the prepare job may pass
      # only the selected codeunits instead (CONTRIBUTING.md, "Test selection in CI"); the same holds for the jobs below.
      codeunit_range:       ${{ fromJson(needs.prepare.outputs.subset)['tests/al-language'] || '50000..75019|75025..99999' }}
      preprocessor_symbols: ${{ matrix.preprocessor_symbols }}
      al_tool_version:      "30.0.43.45776-beta"
      runtime_version:      ${{ matrix.runtime }}
      # Pinned to the 29.0 build before 29.0.54011.55892 (published 2026-10-07). That build
      # reports debugger protocol 9.0, and no published al tool supports it yet: 18.0.37.11445-beta
      # and 18.0.43.1464 stop at 7.0, 30.0.42.60748-beta at 8.0, so every codeunit ended "al
      # runtests exited 1 with no results" (corpus #561). Remove this once an al tool lists
      # debugger 9.0.
      bc_artifact_url: ${{ startsWith(matrix.bc_version, '29.') && 'https://bcartifacts-exdbf9fwegejdqak.b02.azurefd.net/sandbox/29.0.54011.55816/w1' || '' }}
      # Creating a company creates its tables, including Base Application's
      # OptimizeForTextSearch indexes, so a test that inserts a Company needs SQL Server
      # Full-Text Search. No official SQL Server Linux image ships it; this tag adds it
      # (MsDyn365Bc.On.Linux issue #20, KNOWN-LIMITATIONS.md). Opt-in there because it
      # adds ~550 MB to the SQL pull. Only this job runs Company-insert tests (67947);
      # test-onprem does not, so it keeps the default image.
      sql_image:            "ghcr.io/aldevtools/msdyn365bc.on.linux/mssql:2022-fts"
      # The default job timeout is 45 minutes. With about 2500 test codeunits the BC 27.5 "Run AL tests" step takes 37 to
      # 40 minutes on a loaded runner, so the 27.5 job was cancelled at 45 minutes twice (run 39269527543, both attempts).
      timeout_minutes:      70
      # Each test phase (hub, websocket) has its own limit, the runner's --timeout (bc-linux input
      # test_timeout_minutes, default 30). The BC 28.5 hub phase reached the 30-minute limit in run 39322214364
      # (1802 s; codeunits 85841 onward were not run). 60 keeps room for growth and stays below timeout_minutes.
      # The OnPrem jobs take about 7 minutes in all and keep the default.
      test_timeout_minutes: 60
      # RDLC rendering (MsDyn365Bc.On.Linux #126/#131): without these the Linux tier stubs the RDLC renderer.
      # They pull bc-runner:rdlc and set BC_RDLC_RENDERER=mono. Report.SaveAs of an RDLC layout is pinned in
      # report/lt-am-rdlc-output (cloud) and report/lt-am-rdlc-saveas (OnPrem). rdlc_trust_layouts is the
      # acknowledgement that RDLC layout code runs unsandboxed; the corpus layouts carry only fixed functions.
      rdlc_renderer:        true
      rdlc_trust_layouts:   true

  # The Target = OnPrem test app, in a job of its own.
  #
  # WHY IT IS A SEPARATE JOB AND NOT A SECOND LINE IN test_app_dirs ABOVE.
  # bc-test-from-source.yml's "Run AL tests" step loops over the test app dirs with
  #
  #     while IFS= read -r d; do ... done <<< "$TEST_APP_DIRS"
  #
  # and runs the test runner inside that loop. run-tests-hybrid.py and
  # run-tests-altool.py both invoke the `al` tool with
  # subprocess.run(cmd, stdout=PIPE, stderr=STDOUT) and never redirect STDIN, so the
  # child inherits the loop's here-string and drains it. The loop therefore executes
  # exactly ONCE no matter how many test apps are listed - and it does so SILENTLY:
  # no "skip:" line, no error, the totals simply cover the first app and the leg goes
  # green.
  #
  # Measured, not guessed: run 33996414648 on this branch listed both apps, compiled
  # and published all three .app files, and then ran only al-language (2617 tests).
  # al-language-onprem's tests never executed and the leg still reported success.
  #
  # One test app per invocation is immune to that, because there is no second
  # iteration to lose. The cost is one extra BC boot per version. When
  # MsDyn365Bc.On.Linux passes stdin=subprocess.DEVNULL at those two call sites, this
  # job collapses back into a second line of the test job's test_app_dirs at zero
  # extra cost - that is the preferred end state, and this job is the way to have the
  # tests actually adjudicated until then.
  #
  # This job's checks are named "BC OnPrem <ver> / test". They are required checks of the
  # master ruleset, like the "BC <ver> / test" checks of the job above.
  test-onprem:
    name: BC OnPrem ${{ matrix.bc_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Workflow and scripts pinned for corpus bump 63 to bc-linux 65f6b26: a write into a missing folder fails with
    # InvalidPath as on Windows (#189). Bump 62 pin 84291ff before: fr-FR group separator U+00A0 on BC 27/28 as on
    # Windows (#174); DotNet System.IO sees the files AL File wrote under the user folder and returns paths with '\'
    # (#175, #181); MediaSet.ImportFile stores the bare file name (#176); Directory/DirectoryInfo listings match patterns
    # case-insensitively and list in name order (#183). Earlier: #165, #166, #167.
    uses: aldevtools/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@65f6b26bbc5041a567790812773522accfae5473
    with:
      bc_linux_ref:         "65f6b26bbc5041a567790812773522accfae5473"
      runner_image:         "ghcr.io/aldevtools/msdyn365bc.on.linux/bc-runner:rdlc-65f6b26bbc5041a567790812773522accfae5473"
      bc_version:           ${{ matrix.bc_version }}
      bc_country:           "w1"
      # al-language is a production app HERE only in the sense that it has to be
      # published for al-language-onprem's dependency on the shared Assert fixture to
      # resolve. Its own tests are not run in this job - the test job above owns them.
      app_dirs: |
        tests/al-language-internals-fixture
        tests/al-language-xapp-a
        tests/al-language-xapp-d
        tests/al-language-xapp-b
        tests/al-language-xapp-c
        tests/al-language
      test_app_dirs:        "tests/al-language-onprem"
      codeunit_range:       ${{ fromJson(needs.prepare.outputs.subset)['tests/al-language-onprem'] || '50000..99999' }}
      preprocessor_symbols: ${{ matrix.preprocessor_symbols }}
      al_tool_version:      "30.0.43.45776-beta"
      runtime_version:      ${{ matrix.runtime }}
      # Pinned to the 29.0 build before 29.0.54011.55892 (published 2026-10-07). That build
      # reports debugger protocol 9.0, and no published al tool supports it yet: 18.0.37.11445-beta
      # and 18.0.43.1464 stop at 7.0, 30.0.42.60748-beta at 8.0, so every codeunit ended "al
      # runtests exited 1 with no results" (corpus #561). Remove this once an al tool lists
      # debugger 9.0.
      bc_artifact_url: ${{ startsWith(matrix.bc_version, '29.') && 'https://bcartifacts-exdbf9fwegejdqak.b02.azurefd.net/sandbox/29.0.54011.55816/w1' || '' }}
      # Full-text search: a table with OptimizeForTextSearch = true needs it to install (corpus #633).
      sql_image:            "ghcr.io/aldevtools/msdyn365bc.on.linux/mssql:2022-fts"
      # RDLC rendering for the OnPrem SaveAs* file forms: see the test job above.
      rdlc_renderer:        true
      rdlc_trust_layouts:   true

  # The Target = OnPrem DotNet test app (tests/al-language-onprem-dotnet), in a job of its own for the same
  # one-test-app-per-invocation reason as test-onprem above. Its dotnet declarations need an AL compiler of 18.0 or
  # newer: the compilers the default policy picks for BC 27 (16.x) and BC 28 (17.x) report AL0451 (mscorlib not found
  # in the assembly probing paths). al_tool_version pins 18.0.43.1464 for every BC version; a newer compiler accepts the
  # app's runtime 16.0.
  test-onprem-dotnet:
    name: BC OnPrem DotNet ${{ matrix.bc_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Workflow and scripts pinned for corpus bump 63 to bc-linux 65f6b26: a write into a missing folder fails with
    # InvalidPath as on Windows (#189). Bump 62 pin 84291ff before: fr-FR group separator U+00A0 on BC 27/28 as on
    # Windows (#174); DotNet System.IO sees the files AL File wrote under the user folder and returns paths with '\'
    # (#175, #181); MediaSet.ImportFile stores the bare file name (#176); Directory/DirectoryInfo listings match patterns
    # case-insensitively and list in name order (#183). Earlier: #165, #166, #167.
    uses: aldevtools/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@65f6b26bbc5041a567790812773522accfae5473
    with:
      bc_linux_ref:         "65f6b26bbc5041a567790812773522accfae5473"
      runner_image:         "ghcr.io/aldevtools/msdyn365bc.on.linux/bc-runner:65f6b26bbc5041a567790812773522accfae5473"
      bc_version:           ${{ matrix.bc_version }}
      bc_country:           "w1"
      app_dirs: |
        tests/al-language-internals-fixture
        tests/al-language-xapp-a
        tests/al-language-xapp-d
        tests/al-language-xapp-b
        tests/al-language-xapp-c
        tests/al-language
      test_app_dirs:        "tests/al-language-onprem-dotnet"
      assembly_probing_paths: |
        platform/Test Assemblies
        platform/ServiceTier/PFiles64/Microsoft Dynamics NAV/*/Service
      codeunit_range:       ${{ fromJson(needs.prepare.outputs.subset)['tests/al-language-onprem-dotnet'] || '50000..99999' }}
      preprocessor_symbols: ${{ matrix.preprocessor_symbols }}
      al_tool_version:      "30.0.43.45776-beta"
      runtime_version:      ${{ matrix.runtime }}
      bc_artifact_url: ${{ startsWith(matrix.bc_version, '29.') && 'https://bcartifacts-exdbf9fwegejdqak.b02.azurefd.net/sandbox/29.0.54011.55816/w1' || '' }}
      # Full-text search: a table with OptimizeForTextSearch = true needs it to install (corpus #633).
      sql_image:            "ghcr.io/aldevtools/msdyn365bc.on.linux/mssql:2022-fts"

    # Optional: supply a base64-encoded BC developer license.
    # Without this, BC boots with the public Cronus license (sufficient
    # for all language coverage tests — no ISV app IDs needed).
    #   base64 -w0 < your.bclicense | gh secret set BC_LICENSE
    # secrets:
    #   bc_license: ${{ secrets.BC_LICENSE }}

  # The test app tests/al-language-testlibraries, in a job of its own that also installs Microsoft's Tests-TestLibraries
  # and Data Archive apps (bc-linux input extra_apps, MsDyn365Bc.On.Linux PR 128).
  #
  # WHY A SEPARATE JOB. A Windows container made with BcContainerHelper has these two apps installed; the Linux tier
  # keeps only the apps that the corpus apps depend on. They change results that AL code can see:
  #   * Tests-TestLibraries codeunit 130011 "Backup Management" sets all four flags of GetDatabaseTableTriggerSetup to
  #     true for every table id in 1..99999 (MsDyn365Bc.On.Linux issue 125);
  #   * the Test Runner's codeunit 130453 runs 130301 "Reset State Before Test Run" before each test and, when the
  #     test's TestPermissions is not Disabled, 130302 "Set State Test Run", which lowers the session to the permission
  #     set 'D365 Full Access'. Without Tests-TestLibraries neither codeunit exists (corpus issue 658).
  # The test job above keeps its installed-app set unchanged: al-runtime-rs models that set as its oracle environment.
  # A test belongs in tests/al-language-testlibraries only when its result needs these apps. Its objects live in
  # 81550..81649 (codeunit_range below; on a pull request the prepare job may pass only the selected codeunits).
  #
  # Not a required status check yet: its checks are named "BC TestLibraries <ver> / test", and the repository's
  # rulesets list only "BC <ver> / test" (add them there once the job has run green for a while).
  test-testlibraries:
    name: BC TestLibraries ${{ matrix.bc_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # Workflow and scripts pinned for corpus bump 63 to bc-linux 65f6b26: a write into a missing folder fails with
    # InvalidPath as on Windows (#189). Bump 62 pin 84291ff before: fr-FR group separator U+00A0 on BC 27/28 as on
    # Windows (#174); DotNet System.IO sees the files AL File wrote under the user folder and returns paths with '\'
    # (#175, #181); MediaSet.ImportFile stores the bare file name (#176); Directory/DirectoryInfo listings match patterns
    # case-insensitively and list in name order (#183). Earlier: #165, #166, #167.
    uses: aldevtools/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@65f6b26bbc5041a567790812773522accfae5473
    with:
      bc_linux_ref:         "65f6b26bbc5041a567790812773522accfae5473"
      runner_image:         "ghcr.io/aldevtools/msdyn365bc.on.linux/bc-runner:rdlc-65f6b26bbc5041a567790812773522accfae5473"
      bc_version:           ${{ matrix.bc_version }}
      bc_country:           "w1"
      # al-language is published only because the test app depends on it (Probe Observer). Its own tests run in the
      # test job above.
      app_dirs: |
        tests/al-language-internals-fixture
        tests/al-language-xapp-a
        tests/al-language-xapp-d
        tests/al-language-xapp-b
        tests/al-language-xapp-c
        tests/al-language
      test_app_dirs:        "tests/al-language-testlibraries"
      codeunit_range:       ${{ fromJson(needs.prepare.outputs.subset)['tests/al-language-testlibraries'] || '81550..81649' }}
      extra_apps: |
        Tests-TestLibraries
        Data Archive
      preprocessor_symbols: ${{ matrix.preprocessor_symbols }}
      al_tool_version:      "30.0.43.45776-beta"
      runtime_version:      ${{ matrix.runtime }}
      bc_artifact_url: ${{ startsWith(matrix.bc_version, '29.') && 'https://bcartifacts-exdbf9fwegejdqak.b02.azurefd.net/sandbox/29.0.54011.55816/w1' || '' }}
      # Full-text search: al-language has tables with OptimizeForTextSearch = true (corpus #633).
      sql_image:            "ghcr.io/aldevtools/msdyn365bc.on.linux/mssql:2022-fts"
      # RDLC rendering: see the test job above (al-language holds RDLC reports).
      rdlc_renderer:        true
      rdlc_trust_layouts:   true
