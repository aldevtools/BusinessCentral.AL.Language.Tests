name: Version changes site

# Builds the Hugo site in docs/ (CONTRIBUTING.md, "Version changes site") and publishes it to GitHub Pages.
# Runs only for pushes to master that change docs/ or this file, and on request. It starts no BC leg: ci.yml ignores
# pushes that change only these paths.
# One-time repository setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Hugo extended, pinned. Hextra (the theme) is pinned in docs/go.mod and docs/go.sum.
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hugo modules download the theme with Go.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22'
          cache: false
      - name: Install Hugo
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir hugo && tar -xzf "$file" -C hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: docs
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
