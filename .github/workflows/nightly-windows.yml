name: Nightly Windows (official MS BC container)

# THE AUTHORITY RUN.
#
# ci.yml runs this corpus on StefanMaron/MsDyn365Bc.On.Linux. That is fast, free and runs on
# every PR -- and it is one particular container, not Business Central. Issue #213 showed the
# gap concretely: a run against a real MS SaaS sandbox failed 14 tests that ci.yml reports
# green. So this workflow exists to run master against an OFFICIAL MICROSOFT BC container on
# WINDOWS and produce the verdict that outranks the Linux one.
#
# The operating rule the owner set in #213:
#   "any test that fails on windows needs to be first fixed on
#    https://github.com/StefanMaron/MsDyn365Bc.On.Linux"
# That is, a Windows failure is a real failure. A Linux-only failure is an image bug.
#
# THIS IS DELIBERATELY NOT A REQUIRED STATUS CONTEXT. Do not add it to the branch ruleset.
# It takes ~1-2 hours, it is a signal for humans, and a nightly that gates merges stalls the
# repository. The required checks from ci.yml (the Cloud, OnPrem and OnPrem DotNet test legs
# for 27.5, 28.5 and 29.0, and the object-id gate) remain the merge gate.
#
# WHY THE ENVIRONMENT IS PINNED AND PRINTED, NOT JUST PINNED.
# Six of #213's 14 failures are properties of the tier, not of BC: three are decimal-comma /
# dd.MM.yy formatting, three are writes refused by the license. If this workflow's region or
# license drifts, it re-reports those as failures forever and everyone learns to ignore it.
# So the session culture is pinned explicitly (and the step FAILS if the pinning parameter is
# not available, rather than running unpinned), and the license, region, container OS, generic
# image and BC build are all written into an artifact next to the results.
#
# THE TENANT ENCRYPTION KEY IS CREATED HERE, AND ONLY HERE (#248, #282).
# A BcContainerHelper container has no tenant encryption key, so IsolatedStorage.SetEncrypted
# and AL's ENCRYPT/DECRYPT refuse outright. A step below creates the TENANT key from AL
# (CreateEncryptionKey(), app .github/nightly-windows/encryption-key), verifies it with an
# Encrypt/Decrypt round trip at the scope AL reads, and FAILS THE RUN if it cannot -- same
# reasoning as the culture pin: a nightly that continues without it re-reports cu 60378 forever
# until everyone ignores it. The earlier version used New-NAVEncryptionKey/Import-NAVEncryptionKey,
# which load the key of the server instance, not of the tenant: its check passed while AL had no
# key (run 38858383715, #282).
#
# HOW TO READ THE SUMMARY THIS PRODUCES (#249).
# The job summary opens with "Failed on THIS run" -- that section, and nothing else in the
# report, is this run's failure list, and its row count equals the headline failure count.
# Everything under the "Historical" rule below it is about the #213 SaaS baseline; error text
# there is replayed from a file and prefixed `sandbox saw:`, and describes events that did not
# happen here. Reading a historical row as a result is how #244 and #246 came to be filed on
# tests that had passed; both were withdrawn.
#
# READ THIS BEFORE TREATING A GREEN ON THE PERMISSION TESTS AS GOOD NEWS.
# Codeunits 60013 and 60827 declare `TestPermissions = Disabled` and no `Permissions` property,
# so their writes fall through to whatever the license grants. So a pass there is a statement
# about the license, not about the test.
#
# WHICH LICENSE, AND WHY THE FAILURE COUNT IS EXPECTED TO RISE (#237).
# The default artifact type is `sandbox`, which narrows that license deliberately. `onprem`
# carries a full CRONUS dev license and MASKS license-refused writes -- the same masking that
# hid #213's three permission failures until a SaaS run exposed them. So expect MORE failures
# on sandbox than the onprem runs reported: that is the instrument working, not a regression,
# and #244's three permission failures (which surfaced even on onprem) are the shape to expect
# more of. A green on a permission test means nothing on either tier while TestPermissions is
# Disabled; on sandbox a RED one is informative, where on onprem it would not have appeared.
#
# sandbox is also the tier whose TenantEnvironmentType gating matches what ci.yml runs, so
# behaviour BC gates on environment type stops producing a false divergence between the two.
# `onprem` stays selectable and is the right pick for a question about a platform capability
# rather than a licensed one. See #213, #237.

on:
  # The reason this trigger is first: confirming #213's list on demand is the immediate job.
  workflow_dispatch:
    inputs:
      bc_version:
        description: 'BC version, e.g. 28.4 (the version #213 was measured on)'
        required: true
        default: '28.4'
      artifact_type:
        # sandbox is the default because the instrument is meant to resemble the tier #213 was
        # measured against. onprem stays selectable and is the right pick for a question about a
        # platform capability rather than a licensed one -- the RDLC/PDF measurement used it
        # deliberately, because there the dev license is a convenience and not a distortion.
        description: 'BC artifact type. sandbox matches the SaaS tier #213 measured and gates TenantEnvironmentType-dependent behaviour correctly, at a narrower license. onprem carries a full CRONUS dev license -- pick it to ask about a platform capability rather than a licensed one.'
        required: true
        default: 'sandbox'
        type: choice
        options: [onprem, sandbox]
      country:
        description: 'Localization. w1 matches ci.yml.'
        required: true
        default: 'w1'
      culture:
        description: 'Session culture for the test run. en-US is the format the corpus hardcodes.'
        required: true
        default: 'en-US'
      free_disk_space:
        description: 'Delete preinstalled SDKs before pulling the BC image. Needed on GitHub-hosted runners.'
        required: false
        default: true
        type: boolean

  schedule:
    # 03:00 UTC. Skipped by the gate job below unless master moved in the last 25 hours.
    - cron: '0 3 * * *'

  # OPT-IN ONLY, never automatic. This fires on `labeled` and the gate job below then
  # requires the label to be exactly `run-nightly-windows`, so an ordinary PR -- including one
  # that edits this very file -- does NOT spend a ~2h Windows run. An earlier revision used a
  # `paths:` filter instead; that kept it off unrelated PRs but still fired on every edit to
  # this workflow, which is too eager for a job this expensive on a repository whose Actions
  # concurrency is shared account-wide.
  #
  # It exists at all because workflow_dispatch is only offered for workflows already on the
  # DEFAULT branch, so before this merges the label is the only way to adjudicate #213.
  # Afterwards it stays useful: label a PR to re-measure against a real Windows tier.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: nightly-windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate on a Linux runner, so deciding "is there anything new to test" never costs a
  # Windows minute. The owner asked for a nightly "whenever there was a new commit on main on
  # the previous day" -- this is that condition, made explicit rather than left to Actions'
  # 60-day auto-disable, which answers a completely different question.
  gate:
    name: Did master move?
    # On a pull_request this workflow is opt-in: nothing runs unless someone deliberately
    # applied `run-nightly-windows`. Skipping the gate skips windows-container with it,
    # because that job is `needs: gate`.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-nightly-windows'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      bc_version: ${{ steps.decide.outputs.bc_version }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always measure master, whatever ref triggered this. Reading a stale or
          # differently-pointed tree is how a wrong answer gets produced confidently.
          ref: master
          fetch-depth: 1

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.bc_version }}
        run: |
          set -euo pipefail

          BC_VERSION="${INPUT_VERSION:-28.4}"
          echo "bc_version=$BC_VERSION" >> "$GITHUB_OUTPUT"

          HEAD_SHA=$(git rev-parse HEAD)
          COMMIT_EPOCH=$(git log -1 --format=%ct HEAD)
          COMMIT_ISO=$(git log -1 --format=%cI HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          echo "master head        : $HEAD_SHA"
          echo "master committed at: $COMMIT_ISO"

          if [ "$EVENT" != "schedule" ]; then
            echo "Triggered by '$EVENT', not the nightly schedule -- running unconditionally."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date -u +%s)
          AGE_HOURS=$(( (NOW - COMMIT_EPOCH) / 3600 ))
          # 25h, not 24h: the schedule fires once a day and GitHub can delay a cron by tens of
          # minutes under load. A flat 24h window would silently drop a day whenever the run
          # started late relative to the commit.
          if [ "$AGE_HOURS" -lt 25 ]; then
            echo "master last moved ${AGE_HOURS}h ago -- inside the 25h window, running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "master last moved ${AGE_HOURS}h ago -- no new commit since the previous nightly, skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "### Nightly gate"
            echo ""
            echo "- master head: \`${{ steps.decide.outputs.head_sha }}\`"
            echo "- BC version: \`${{ steps.decide.outputs.bc_version }}\`"
            echo "- run: **${{ steps.decide.outputs.should_run }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-container:
    name: BC ${{ needs.gate.outputs.bc_version }} on an official MS Windows container
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    # Set the repository variable NIGHTLY_WINDOWS_RUNNER to move this onto a self-hosted
    # Windows runner without editing the workflow -- the escape hatch if a GitHub-hosted
    # runner turns out not to have the disk for a BC image plus artifacts.
    runs-on: ${{ vars.NIGHTLY_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh

    env:
      BC_VERSION: ${{ needs.gate.outputs.bc_version }}
      # Keep this fallback and the workflow_dispatch input's `default:` in step. They are two
      # separate materialisations of the same decision -- the input default applies to a manual
      # dispatch, this fallback to `schedule` and `pull_request`, where `github.event.inputs` is
      # empty -- and if they disagree, the nightly and the on-demand run measure different tiers
      # while both reporting under the same name.
      ARTIFACT_TYPE: ${{ github.event.inputs.artifact_type || 'sandbox' }}
      COUNTRY: ${{ github.event.inputs.country || 'w1' }}
      CULTURE: ${{ github.event.inputs.culture || 'en-US' }}
      TIMEZONE: 'UTC'
      CONTAINER_NAME: 'bcnightly'

    steps:
      - uses: actions/checkout@v4

      # Run 38851717694 (BC 29.0, workflow_dispatch) found the docker CLI but no daemon:
      # every `docker` call failed on npipe:////./pipe/docker_engine, so no test ran.
      # Start the service if it is stopped, then wait for the engine to answer. Failing
      # here says "the daemon never came up", not a downstream parse error.
      - name: Wait for the docker daemon
        run: |
          $ErrorActionPreference = 'Continue'
          $svc = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            Write-Host "::warning::no 'docker' service is registered on this runner"
          } elseif ($svc.Status -ne 'Running') {
            Write-Host "docker service is '$($svc.Status)'; starting it"
            Start-Service -Name docker -ErrorAction Continue
          }
          $deadline = (Get-Date).AddMinutes(3)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $os = (docker info --format '{{.OSType}}' 2>$null)
            if ($LASTEXITCODE -eq 0 -and $os) { $ready = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) {
            Get-Service -Name docker -ErrorAction SilentlyContinue | Format-List Name, Status, StartType
            Write-Host "::error::the docker daemon did not answer within 3 minutes; no verdict is possible on this runner"
            exit 1
          }
          Write-Host "docker daemon is up (OSType: $os)"

      # ---------------------------------------------------------------------------------
      # Measurement first. If a GitHub-hosted Windows runner cannot carry a BC container,
      # this is where that shows up, with numbers attached rather than as a vague timeout.
      # ---------------------------------------------------------------------------------
      - name: Host, docker and disk (before)
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== OS ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Write-Host "=== CPU / RAM ==="
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host ("Logical processors: {0}" -f $cs.NumberOfLogicalProcessors)
          Write-Host ("RAM (GB)         : {0}" -f [math]::Round($cs.TotalPhysicalMemory/1GB,1))
          Write-Host "=== Disks ==="
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
              @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.FreeSpace/1GB,1)}} | Format-Table -AutoSize
          Write-Host "=== Docker ==="
          docker version
          Write-Host ("OSType      : {0}" -f (docker info --format '{{.OSType}}'))
          Write-Host ("DockerRootDir: {0}" -f (docker info --format '{{.DockerRootDir}}'))
          Write-Host ("Isolation   : {0}" -f (docker info --format '{{.Isolation}}'))

      - name: Refuse to continue on a Linux docker daemon
        run: |
          $ErrorActionPreference = 'Stop'
          $osType = (docker info --format '{{.OSType}}').Trim()
          if ($osType -ne 'windows') {
            # The entire point of this workflow is that it is NOT the Linux image. Running a
            # Linux container here would produce a verdict indistinguishable from ci.yml's
            # while being labelled as the Windows authority -- worse than no verdict.
            throw "docker is in '$osType' container mode, not 'windows'. This workflow must run an official Microsoft Windows BC container; refusing to produce a verdict that would be mistaken for one."
          }
          Write-Host "docker is in Windows container mode."

      # MEASURED, on the run that adjudicated #213 (run 34057062917, windows-latest):
      # a plain `Remove-Item -Recurse -Force` over this target list took 11 MIN 53 S -- more
      # than the BC container took to boot. Deleting an SDK tree on Windows is dominated by
      # per-file NTFS transactions, and the Android SDK alone is ~100k files.
      #
      # Two changes, in order of how much they save:
      #   1. Do not clean at all unless the disk is actually short. The threshold is checked
      #      against the real requirement (image + extracted artifacts), not a guess.
      #   2. When cleaning is needed, purge with `robocopy /MIR` from an empty directory --
      #      the fastest bulk delete on Windows -- and run the targets in PARALLEL, since
      #      they are independent trees and the cost is I/O latency, not CPU.
      - name: Free disk space (only if short)
        if: ${{ github.event.inputs.free_disk_space != 'false' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $sw = [Diagnostics.Stopwatch]::StartNew()

          # A BC generic image (~10 GB) plus extracted artifacts (~15 GB) plus the container's
          # own database and working set. 45 GB is the point below which it is worth paying to
          # clean; above it, cleaning buys nothing and costs minutes.
          $requiredGB = 45
          $free = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace / 1GB
          Write-Host ("C: free: {0:n1} GB (threshold {1} GB)" -f $free, $requiredGB)
          if ($free -ge $requiredGB) {
            Write-Host "Enough free space -- skipping cleanup entirely."
            exit 0
          }

          $empty = Join-Path $env:RUNNER_TEMP 'empty'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null

          # Biggest first, so a time cap still reclaims the most.
          $targets = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Unity',
            'C:\Miniconda',
            'C:\Rust',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MongoDB',
            'C:\Program Files\Google',
            'C:\Program Files (x86)\Google',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\go'
          ) | Where-Object { Test-Path $_ }

          $jobs = foreach ($t in $targets) {
            Start-Job -ArgumentList $t, $empty -ScriptBlock {
              param($target, $empty)
              # /MIR against an empty source empties the tree; /NFL /NDL /NJH /NJS /NP keep it
              # from writing a line per file, which is itself a measurable cost here.
              robocopy $empty $target /MIR /NFL /NDL /NJH /NJS /NP /R:0 /W:0 | Out-Null
              Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          # Hard cap: this step exists to make the run possible, never to become the run.
          $jobs | Wait-Job -Timeout 240 | Out-Null
          $jobs | Stop-Job -ErrorAction SilentlyContinue
          $jobs | Remove-Job -Force -ErrorAction SilentlyContinue

          $after = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace / 1GB
          Write-Host ("C: free {0:n1} -> {1:n1} GB (reclaimed {2:n1} GB) in {3:n0}s" -f
            $free, $after, ($after - $free), $sw.Elapsed.TotalSeconds)

      - name: Install BcContainerHelper
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module BcContainerHelper -Force -AllowClobber -Scope CurrentUser
          Import-Module BcContainerHelper -DisableNameChecking
          $m = Get-Module BcContainerHelper
          Write-Host ("BcContainerHelper {0}" -f $m.Version)
          "BCCH_VERSION=$($m.Version)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve the official Microsoft artifact URL
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module BcContainerHelper -DisableNameChecking

          # Put the artifact cache on whichever fixed drive has the most room. On a
          # GitHub-hosted runner the workspace is on D: while docker's data root is on C:,
          # and the artifacts are large enough that guessing wrong is a run-ending mistake.
          $best = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
                    Sort-Object FreeSpace -Descending | Select-Object -First 1
          $cache = Join-Path $best.DeviceID 'bcartifacts.cache'
          $bcContainerHelperConfig.bcartifactsCacheFolder = $cache
          Write-Host ("artifact cache -> {0} ({1:n1} GB free)" -f $cache, ($best.FreeSpace/1GB))
          "BC_ARTIFACT_CACHE=$cache" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $url = Get-BCArtifactUrl -type $env:ARTIFACT_TYPE -country $env:COUNTRY `
                                   -version $env:BC_VERSION -select Latest
          if (-not $url) {
            throw "No $($env:ARTIFACT_TYPE) artifact found for BC $($env:BC_VERSION) country $($env:COUNTRY)."
          }
          Write-Host "artifactUrl: $url"
          "BC_ARTIFACT_URL=$url" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create the BC container
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module BcContainerHelper -DisableNameChecking
          $bcContainerHelperConfig.bcartifactsCacheFolder = $env:BC_ARTIFACT_CACHE

          # MEASURED (run 34057062917): without sharing the workspace, the compile step dies
          # with "The appProjectFolder (D:\a\...) is not shared with the container."
          # (Since 2026-10-20 the apps compile on the host with the latest AL compiler, see "Install the
          # latest AL compiler"; the share stays for the publish and test steps.)
          # Compile-AppInBcContainer runs the AL compiler INSIDE the container, so the sources
          # have to be reachable from in there. BcContainerHelper shares its own helper and
          # artifact folders by default but never the GitHub workspace, which on a hosted
          # Windows runner sits on D:. Mounting it lets Get-BcContainerPath translate
          # D:\a\...\tests\x to c:\sources\tests\x -- which every -appProjectFolder,
          # -appOutputFolder and -appSymbolsFolder argument later on relies on.
          $volume = '--volume "{0}:c:\sources"' -f $env:GITHUB_WORKSPACE
          Write-Host "sharing workspace: $volume"

          $password = [guid]::NewGuid().ToString() + 'aA1!'
          $cred = New-Object pscredential 'admin', (ConvertTo-SecureString $password -AsPlainText -Force)
          $cred | Export-Clixml -Path (Join-Path $env:RUNNER_TEMP 'bccred.xml')

          $params = @{
            accept_eula          = $true
            accept_outdated      = $true
            containerName        = $env:CONTAINER_NAME
            artifactUrl          = $env:BC_ARTIFACT_URL
            auth                 = 'UserPassword'
            Credential           = $cred
            updateHosts          = $true
            shortcuts            = 'None'
            includeTestToolkit   = $true      # brings the Test Runner (130450/130454/130456)
            includeTestLibrariesOnly = $true  # ... without Microsoft's own test apps
            doNotExportObjectsToText = $true
            useBestContainerOS   = $true      # match the host build so process isolation works
            isolation            = 'process'
            additionalParameters = @($volume)
          }
          # Newer BcContainerHelper needs this for insider builds; older ones do not have the
          # parameter at all and would hard-error on it.
          if ((Get-Command New-BcContainer).Parameters.ContainsKey('accept_insiderEula')) {
            $params['accept_insiderEula'] = $true
          }

          $sw = [Diagnostics.Stopwatch]::StartNew()
          New-BcContainer @params
          Write-Host ("container created in {0:n1} min" -f $sw.Elapsed.TotalMinutes)

          # Prove the share took, HERE, rather than discovering it later as a confusing
          # message from inside Compile-AppInBcContainer.
          $mapped = Get-BcContainerPath -containerName $env:CONTAINER_NAME -path $env:GITHUB_WORKSPACE
          if (-not $mapped) {
            throw "The workspace ($env:GITHUB_WORKSPACE) is not visible inside the container. Compiling would fail with 'is not shared with the container'."
          }
          Write-Host ("workspace {0} -> {1} inside the container" -f $env:GITHUB_WORKSPACE, $mapped)

      # ---------------------------------------------------------------------------------
      # The AL compiler: the newest one, never the container's own (owner rule 2026-10-20).
      #
      # WHY. Every corpus app compiles with the latest AL compiler, on every BC version and in
      # every workflow. The container's compiler is the one that shipped with that BC build.
      # Run 39363023181 (BC 28.4): that compiler crashed on Report "LT AW Layouts"
      # ("Sequence contains no elements" in Excel layout validation), so no test ran.
      #
      # WHERE IT COMES FROM. The same place and the same version as ci.yml's Linux legs:
      # nuget.org, package Microsoft.Dynamics.BusinessCentral.Development.Tools, version =
      # ci.yml's `al_tool_version`. This step reads that pin from ci.yml, so the two tiers
      # cannot drift apart: bump the pin in ci.yml and the nightly follows. The package holds a
      # framework-dependent alc.exe (tools/net8.0/any), which runs on the Windows runner with
      # .NET 8. (bc-linux's install-al-compiler.sh takes the compiler from this same package.)
      #
      # HOW. BcContainerHelper's New-BcCompilerFolder builds a compiler folder on the HOST: the
      # symbols (.app files) and service-tier DLLs from this run's BC artifact, the same build
      # the container runs, and the compiler from -vsixFile. A folder laid out as
      # extension\bin\alc.exe is the "flat bin" VSIX layout it accepts. The compile steps call
      # Compile-AppWithBcCompilerFolder and then publish the .app into the container.
      # New-BcCompilerFolder copies only some test libraries into the symbols; the corpus also
      # needs Test Runner and Permissions Mock, so every other .app of the artifact's
      # Applications folders is added with Copy-AppFilesToCompilerFolder (Microsoft's own test
      # apps excepted).
      # ---------------------------------------------------------------------------------
      - name: Set up .NET 8 for the AL compiler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the latest AL compiler (same pin as ci.yml)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module BcContainerHelper -DisableNameChecking
          $bcContainerHelperConfig.bcartifactsCacheFolder = $env:BC_ARTIFACT_CACHE

          $ci = Get-Content (Join-Path $env:GITHUB_WORKSPACE '.github/workflows/ci.yml') -Raw
          $pins = @([regex]::Matches($ci, '(?m)^\s*al_tool_version:\s*"([^"]+)"') |
                    ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          if ($pins.Count -ne 1) {
            throw "ci.yml must pin exactly one al_tool_version; found: $($pins -join ', ')"
          }
          $ver = $pins[0]
          Write-Host "AL compiler: Microsoft.Dynamics.BusinessCentral.Development.Tools $ver (from ci.yml)"

          $pkg = 'microsoft.dynamics.businesscentral.development.tools'
          $nupkg = Join-Path $env:RUNNER_TEMP "$pkg.$ver.zip"
          $extract = Join-Path $env:RUNNER_TEMP 'al-tools-nupkg'
          Invoke-WebRequest -UseBasicParsing -OutFile $nupkg `
            -Uri "https://api.nuget.org/v3-flatcontainer/$pkg/$ver/$pkg.$ver.nupkg"
          Expand-Archive -Path $nupkg -DestinationPath $extract -Force
          $toolDir = Join-Path $extract 'tools/net8.0/any'
          if (-not (Test-Path (Join-Path $toolDir 'alc.exe'))) {
            throw "No tools/net8.0/any/alc.exe in $pkg $ver."
          }
          $vsix = Join-Path $env:RUNNER_TEMP 'al-compiler-vsix'
          $bin = Join-Path $vsix 'extension/bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item -Path (Join-Path $toolDir '*') -Destination $bin -Recurse -Force
          & (Join-Path $bin 'alc.exe') /? | Select-Object -First 2 | ForEach-Object { Write-Host "alc: $_" }

          $cf = New-BcCompilerFolder -artifactUrl $env:BC_ARTIFACT_URL -containerName 'nightlyalc' -vsixFile $vsix
          Write-Host "compiler folder: $cf"

          $symbols = Join-Path $cf 'symbols'
          $have = @(Get-ChildItem -Path $symbols -Filter '*.app' | ForEach-Object Name)
          $paths = Download-Artifacts -artifactUrl $env:BC_ARTIFACT_URL -includePlatform
          $extra = @(foreach ($p in $paths) {
            Get-ChildItem -Path $p -Directory -Filter '?pplications*' | ForEach-Object {
              Get-ChildItem -Path $_.FullName -Filter '*.app' -Recurse
            }
          }) | Where-Object { $_.Name -notlike 'Microsoft_Tests-*' -and $have -notcontains $_.Name } |
               Sort-Object Name -Unique
          Write-Host ("adding {0} more .app files from the artifact to the symbols" -f $extra.Count)
          if ($extra.Count) {
            Copy-AppFilesToCompilerFolder -compilerFolder $cf -appFiles @($extra | ForEach-Object FullName)
          }
          foreach ($n in 'Test Runner', 'Permissions Mock', 'System Application Test Library', 'Base Application') {
            if (-not (Get-ChildItem -Path $symbols -Filter "*$n*.app")) { throw "No $n symbols in $symbols." }
          }

          "BC_COMPILER_FOLDER=$cf" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AL_COMPILER_VERSION=$ver" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "- AL compiler: ``Microsoft.Dynamics.BusinessCentral.Development.Tools $ver`` (nuget.org, same pin as ci.yml)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ---------------------------------------------------------------------------------
      # Create a tenant encryption key (#248, #282).
      #
      # WHY THIS STEP EXISTS. `IsolatedStorage.SetEncrypted`, AL's ENCRYPT/DECRYPT and Data
      # Encryption Management all resolve their key through the same call chain
      # (TenantEncryptionProviderFactory -> TenantRsaEncryptionProvider). A container created
      # by New-BcContainer has no tenant encryption key, so BC correctly refuses with
      # "An encryption key is required to complete the request." and cu 60378's two encryption
      # tests (and cu 72522 Decrypt_EmptyText) fail. That is a property of the tier, not a BC
      # divergence -- so the tier is what gets fixed.
      #
      # WHY NOT THE NAV CMDLETS (#282). The earlier version of this step ran New-NAVEncryptionKey and
      # Import-NAVEncryptionKey -ServerInstance BC, and verified with Export-NAVEncryptionKey. That
      # loads the key of the SERVER INSTANCE (the one that protects the database password). AL reads
      # the key of the TENANT, so the export succeeded (1680 bytes) while AL still had no key: run
      # 38858383715 (BC 29.0) failed both cu 60378 encryption tests with the step green.
      #
      # WHAT IT DOES NOW. It creates the tenant key the way BC itself does (the "Data Encryption
      # Management" page): AL's CreateEncryptionKey(), from a small app in
      # .github/nightly-windows/encryption-key. The install trigger creates the key; if it is still
      # missing, Invoke-NAVCodeunit runs the same code once more. Neither runs inside a test
      # transaction (creating a key inside a nested transaction fails). Then it VERIFIES AT THE
      # SCOPE AL READS: Invoke-NAVCodeunit runs Verify(), which raises unless EncryptionEnabled()
      # and EncryptionKeyExists() are true and Decrypt(Encrypt(x)) = x with a ciphertext that is not
      # x. Afterwards the app is unpublished again (the key stays), so the corpus runs on the same
      # set of apps as before.
      #
      # WHY IT THROWS RATHER THAN WARNING. A nightly that silently continues without a key
      # re-reports cu 60378 forever, and everyone learns to ignore a failure that is really a
      # setup defect. If the key cannot be created, that is a fact about this run that must stop it.
      - name: Create a tenant encryption key
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module BcContainerHelper -DisableNameChecking
          $c = $env:CONTAINER_NAME
          $cred = Import-Clixml (Join-Path $env:RUNNER_TEMP 'bccred.xml')
          $folder = Join-Path $env:GITHUB_WORKSPACE '.github/nightly-windows/encryption-key'
          $outDir = Join-Path $env:GITHUB_WORKSPACE '.output-encryption-key'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $appJson = Get-Content (Join-Path $folder 'app.json') -Raw | ConvertFrom-Json

          # The latest AL compiler on the host, not the container's (see "Install the latest AL compiler").
          $appFile = Compile-AppWithBcCompilerFolder -compilerFolder $env:BC_COMPILER_FOLDER `
            -appProjectFolder $folder -appOutputFolder $outDir `
            -appSymbolsFolder (Join-Path $outDir 'symbols') -failOn 'error'
          # The install trigger (OnInstallAppPerDatabase) creates the key.
          Publish-BcContainerApp -containerName $c -credential $cred `
            -appFile $appFile -skipVerification -sync -install

          $company = (Get-CompanyInBcContainer -containerName $c | Select-Object -First 1).CompanyName
          Write-Host "company for Invoke-NAVCodeunit: $company"
          function Invoke-KeyCodeunit([string]$method) {
            $p = @{ containerName = $c; CompanyName = $company; CodeunitId = 81849 }
            if ($method) { $p['MethodName'] = $method }
            Invoke-NavContainerCodeunit @p
          }
          function Get-KeyState {
            # Report() always raises; its message is the state and the log of every attempt.
            try { Invoke-KeyCodeunit 'Report'; 'Report did not raise' } catch { $_.Exception.Message }
          }
          function Test-Key {
            try { Invoke-KeyCodeunit 'Verify'; $true } catch { Write-Host "verify: $($_.Exception.Message)"; $false }
          }

          # Measured (runs 39223200014, 39223203793, 39223208230: BC 29.0 sandbox, 29.0 onprem, 27.5 onprem): the install
          # trigger creates the key and Verify passes. The second attempt below is a fallback that has not been needed yet.
          $ok = Test-Key
          if (-not $ok) {
            Write-Host ("after install: " + (Get-KeyState))
            # Still no usable key: run the same creation once more, from a session of its own.
            try { Invoke-KeyCodeunit '' } catch { Write-Host "invoke OnRun raised: $($_.Exception.Message)" }
            $ok = Test-Key
          }
          $state = if ($ok) { 'verified' } else { Get-KeyState }
          Write-Host "tenant encryption key: $state"

          # Remove the helper app again; the key belongs to the tenant and stays. Not fatal: an
          # installed helper app changes nothing the corpus asserts.
          try {
            $u = @{ containerName = $c; appName = $appJson.name; publisher = $appJson.publisher; version = $appJson.version; uninstall = $true }
            if ((Get-Command Unpublish-BcContainerApp).Parameters.ContainsKey('doNotSaveData')) { $u['doNotSaveData'] = $true }
            Unpublish-BcContainerApp @u
          } catch { Write-Host "::warning::could not unpublish the encryption key app: $($_.Exception.Message)" }

          if (-not $ok) {
            throw "No working tenant encryption key (Verify failed). Refusing to run: cu 60378's encryption tests would then fail for a setup reason and be read as a BC divergence. $state"
          }
          "TENANT_ENCRYPTION_KEY=created (CreateEncryptionKey from AL, verified by an Encrypt/Decrypt round trip)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # ---------------------------------------------------------------------------------
      # Declare the tier. Half of #213's failures are properties of the environment, so a
      # verdict without this block attached is not interpretable.
      # ---------------------------------------------------------------------------------
      - name: Record the environment this verdict is about
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module BcContainerHelper -DisableNameChecking
          $c = $env:CONTAINER_NAME

          function Try-Get([scriptblock]$b, $fallback = 'unavailable') {
            try { $v = & $b; if ($null -ne $v -and "$v".Trim()) { return "$v".Trim() } else { return $fallback } }
            catch { return "$fallback ($($_.Exception.Message))" }
          }

          # MEASURED (run 34057062917): Export-NAVServerLicenseInformation has no -Path
          # parameter on BC 28.4, and that attempt recorded the license as
          # "unavailable (A parameter cannot be found that matches parameter name 'Path')".
          # The license tier is load-bearing for reading this verdict at all (see #213), so
          # try the documented spellings in turn instead of shipping one guess.
          $license = Try-Get {
            Invoke-ScriptInBcContainer -containerName $c -scriptblock {
              $out = @()
              try { $out += (Get-NAVServerLicenseInformation -ServerInstance BC | Out-String) } catch {}
              if (-not ($out -join '').Trim()) {
                try {
                  $p = Join-Path $env:TEMP 'licenseinfo.txt'
                  Export-NAVServerLicenseInformation -ServerInstance BC -FilePath $p -Force
                  $out += (Get-Content $p -Raw)
                } catch {}
              }
              if (-not ($out -join '').Trim()) {
                try { $out += (Get-NAVServerConfiguration -ServerInstance BC -KeyName LicenseFile | Out-String) } catch {}
              }
              ($out -join "`n")
            }
          } 'probe failed: no license text came back from Get-NAVServerLicenseInformation, Export-NAVServerLicenseInformation -FilePath or Get-NAVServerConfiguration LicenseFile. This says nothing about the license itself.'
          # Keep the whole license dump in the artifact, but put a one-line identity in the table.
          $license | Out-File 'license-information.txt' -Encoding utf8
          $licenseLine = ($license -split "`n" | Where-Object { $_ -match '\S' } | Select-Object -First 6) -join ' / '

          $containerLocale = Try-Get {
            Invoke-ScriptInBcContainer -containerName $c -scriptblock {
              "SystemLocale=$((Get-WinSystemLocale).Name); Culture=$((Get-Culture).Name)"
            }
          }

          $env_table = [ordered]@{
            'Corpus commit'          = "$env:GITHUB_SHA"
            'BC version (requested)' = "$env:BC_VERSION"
            'BC build (actual)'      = Try-Get { Get-BcContainerNavVersion -containerOrImageName $c }
            'Artifact type'          = "$env:ARTIFACT_TYPE"
            'Country / localization' = "$env:COUNTRY"
            'Artifact URL'           = ($env:BC_ARTIFACT_URL -replace '\?.*$', '')
            'Generic image'          = Try-Get { Get-BcContainerGenericTag -containerOrImageName $c }
            'Container OS'           = Try-Get { Get-BcContainerOsVersion -containerOrImageName $c }
            'Host OS'                = (Get-CimInstance Win32_OperatingSystem).Version
            'Isolation'              = 'process'
            'Session culture (PINNED)'  = "$env:CULTURE"
            'Session timezone (PINNED)' = "$env:TIMEZONE"
            'Container OS locale'    = $containerLocale
            # #248: a tier without one refuses IsolatedStorage.SetEncrypted / ENCRYPT outright,
            # and ci.yml's Linux image fakes it (Patch #26). Record which of the two this was.
            'Tenant encryption key'  = ("$env:TENANT_ENCRYPTION_KEY", 'NOT CREATED')[[string]::IsNullOrWhiteSpace($env:TENANT_ENCRYPTION_KEY)]
            'License'                = $licenseLine
            'BcContainerHelper'      = "$env:BCCH_VERSION"
          }
          $env_table | ConvertTo-Json | Out-File 'environment.json' -Encoding utf8
          $env_table.GetEnumerator() | ForEach-Object { Write-Host ("{0,-26}: {1}" -f $_.Key, $_.Value) }

      # The apps' app.json says runtime 18.0 (the newest). A BC 27 or 28 server refuses a newer runtime than its own
      # ("17.1 or earlier"), so set the runtime per leg, the same values ci.yml uses (27 -> 16.1, 28 -> 17.1,
      # 29 -> 18.0). Changes the checkout of this job only; no test file is committed.
      - name: Set the app runtime for this BC version
        run: |
          $ErrorActionPreference = 'Stop'
          $major = [int]($env:BC_VERSION -split '\.')[0]
          $rt = switch ($major) { 27 { '16.1' } 28 { '17.1' } default { '18.0' } }
          Write-Host "app runtime for BC $env:BC_VERSION : $rt"
          foreach ($f in Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Filter app.json -Recurse -Depth 2) {
            $raw = [IO.File]::ReadAllText($f.FullName)
            $new = [regex]::Replace($raw, '("runtime"\s*:\s*)"[0-9.]+"', ('${1}"' + $rt + '"'))
            if ($new -ne $raw) {
              [IO.File]::WriteAllText($f.FullName, $new, (New-Object Text.UTF8Encoding($false)))
              Write-Host "runtime $rt -> $($f.FullName)"
            }
          }

      - name: Compile and publish the corpus apps
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module BcContainerHelper -DisableNameChecking
          $c = $env:CONTAINER_NAME
          $cred = Import-Clixml (Join-Path $env:RUNNER_TEMP 'bccred.xml')

          # Same symbols ci.yml computes, from the same rule.
          $major = [int]($env:BC_VERSION -split '\.')[0]
          $symbols = @()
          foreach ($v in 27, 28, 29) { if ($v -le $major) { $symbols += "BC${v}PLUS" } }
          Write-Host ("preprocessor symbols: {0}" -f ($symbols -join ','))

          # Order matters: the fixture and the cross-app fixtures A, B and C (CONTRIBUTING.md, "Multi-app fixtures") are
          # dependencies of al-language, which is in turn a dependency of al-language-onprem. D depends on A only and is
          # published right after A, before B, as in ci.yml (subscriber order of apps that do not depend on each other).
          $apps = @('tests/al-language-internals-fixture', 'tests/al-language-xapp-a', 'tests/al-language-xapp-d',
                    'tests/al-language-xapp-b', 'tests/al-language-xapp-c', 'tests/al-language', 'tests/al-language-onprem')
          $outDir = Join-Path $env:GITHUB_WORKSPACE '.output'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          foreach ($folder in $apps) {
            Write-Host "::group::compile $folder"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            # The latest AL compiler on the host, not the container's (see "Install the latest AL compiler").
            # -CopyAppToSymbolsFolder: the next app in the list compiles against this one.
            $appFile = Compile-AppWithBcCompilerFolder -compilerFolder $env:BC_COMPILER_FOLDER `
              -appProjectFolder (Join-Path $env:GITHUB_WORKSPACE $folder) `
              -appOutputFolder $outDir `
              -appSymbolsFolder (Join-Path $outDir 'symbols') `
              -CopyAppToSymbolsFolder -preProcessorSymbols $symbols -failOn 'error'
            Write-Host ("compiled {0} in {1:n0}s -> {2}" -f $folder, $sw.Elapsed.TotalSeconds, $appFile)
            Write-Host "::endgroup::"

            Write-Host "::group::publish $folder"
            # THROUGH THE DEV ENDPOINT, as the test user (#376). ci.yml (MsDyn365Bc.On.Linux) publishes through the dev
            # endpoint, so the install triggers run as the user who publishes (ADMIN, SUPER, client type SOAP).
            # Publish-NAVApp/Install-NAVApp (the default of Publish-BcContainerApp) run them as SYSTEM: no User row, not
            # SUPER, client type Background (measured on BC 27.5 and 29.0, runs 39223200014, 39223203793, 39223208230).
            # With the cmdlets, cu 60589 TestInstall_SessionUserIsSuperDuringInstall failed on Windows only because the
            # two tiers installed the app in two different ways.
            Publish-BcContainerApp -containerName $c -credential $cred `
              -appFile $appFile -skipVerification -sync -install -useDevEndpoint
            Write-Host "::endgroup::"
          }

          Write-Host "=== installed apps ==="
          Get-BcContainerAppInfo -containerName $c |
            Select-Object Name, Publisher, Version, IsInstalled | Format-Table -AutoSize

      # ---------------------------------------------------------------------------------
      # Run the corpus: EVERY test codeunit of each app, in chunks, with restarts.
      #
      # WHY CHUNKS. One Run-TestsInBcContainer call per app used to run the whole app. When the
      # test runner stopped partway, the call returned normally and every later codeunit was
      # silently missing. Measured: run 39227679359 (BC 29.0) stopped after codeunit 67202 on
      # "ERROR DIALOG: We can't save your changes right now, because a record in table 'Test
      # Method Line' is being updated in a transaction done by another session." and reported
      # 558 of 2423 test codeunits. (The scheduled runs looked complete only because they
      # measured `master`, which then ended at codeunit 69982.)
      #
      # HOW. The list of expected codeunits comes from the compiled .app (SymbolReference.json:
      # Subtype = Test with at least one [Test] method), read by codeunit-coverage.py.
      # Each call runs the next chunk of not-yet-reported codeunits, selected by
      # -testCodeunitRange (a range filter that never spans another corpus app's test codeunit
      # or one that already reported). When a call reports nothing, the first codeunit of the
      # chunk is halved until the first codeunit runs alone; if it still reports nothing, it is a
      # "runner stop": written into the XUnit file as one failed test with the reason, and the run
      # goes on with the next codeunit (run 39390812023: onprem 61276 "LT Q File Probes"). Each call writes its own XUnit file; they are merged into
      # xunit-<app>.xml. The step "Every test codeunit reported" below fails the job when any
      # codeunit is silently missing (not reported and not a runner stop).
      # ---------------------------------------------------------------------------------
      - name: Run the corpus
        id: run_tests
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module BcContainerHelper -DisableNameChecking
          $c = $env:CONTAINER_NAME
          $cred = Import-Clixml (Join-Path $env:RUNNER_TEMP 'bccred.xml')

          # Pinning the session culture is not optional -- three of #213's failures are pure
          # formatting. If this build of BcContainerHelper cannot pin it, stop: an unpinned run
          # would report those three as BC divergences on any European-defaulting image.
          $rt = Get-Command Run-TestsInBcContainer
          foreach ($p in 'culture', 'timezone', 'testCodeunitRange', 'interactionTimeout') {
            if (-not $rt.Parameters.ContainsKey($p)) {
              throw "Run-TestsInBcContainer has no -$p parameter in BcContainerHelper $env:BCCH_VERSION. Refusing to run with an undeclared session $p."
            }
          }

          $outDir = Join-Path $env:GITHUB_WORKSPACE '.output'
          $allApps = @(Get-ChildItem -Path $outDir -Filter '*.app' -File)
          $coverage = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/codeunit-coverage.py'
          $chunkSize = 100

          # "a..b|c..d" over $ids, split wherever a $blocked id lies between two neighbours.
          function ConvertTo-RangeFilter([int[]]$ids, [int[]]$sortedBlocked) {
            $parts = @(); $start = $ids[0]; $prev = $ids[0]
            foreach ($i in ($ids | Select-Object -Skip 1)) {
              $k = [Array]::BinarySearch($sortedBlocked, $prev + 1); if ($k -lt 0) { $k = -bnot $k }
              if ($k -lt $sortedBlocked.Length -and $sortedBlocked[$k] -lt $i) {
                $parts += $(if ($start -eq $prev) { "$start" } else { "$start..$prev" }); $start = $i
              }
              $prev = $i
            }
            $parts += $(if ($start -eq $prev) { "$start" } else { "$start..$prev" })
            $parts -join '|'
          }
          function Get-ReportedIds([string]$file) {
            $set = [System.Collections.Generic.HashSet[int]]::new()
            if (Test-Path $file) {
              try {
                [xml]$x = [IO.File]::ReadAllText($file)
                foreach ($a in $x.SelectNodes('//assembly')) {
                  $head = ($a.GetAttribute('name') -split ' ', 2)[0]
                  $n = 0; if ([int]::TryParse($head, [ref]$n)) { [void]$set.Add($n) }
                }
              } catch { Write-Host "::warning::cannot read $file : $($_.Exception.Message)" }
            }
            ,$set
          }

          $suites = @(
            @{ name = 'al-language';        folder = 'tests/al-language' },
            @{ name = 'al-language-onprem'; folder = 'tests/al-language-onprem' }
          )

          foreach ($s in $suites) {
            $appJson = Get-Content (Join-Path $env:GITHUB_WORKSPACE "$($s.folder)/app.json") -Raw | ConvertFrom-Json
            $app = $allApps | Where-Object { $_.Name -eq "$($appJson.publisher)_$($appJson.name)_$($appJson.version).app" } | Select-Object -First 1
            if (-not $app) { throw "No compiled .app for $($s.folder) in $outDir." }
            $others = @($allApps | Where-Object { $_.FullName -ne $app.FullName } | ForEach-Object { '--other'; $_.FullName })
            $info = & python $coverage ids --app $app.FullName @others | ConvertFrom-Json
            $expected = @($info.tests | ForEach-Object { [int]$_ })
            $blockedBase = [System.Collections.Generic.HashSet[int]]::new()
            foreach ($i in @($info.foreign) + @($info.no_methods)) { [void]$blockedBase.Add([int]$i) }
            Write-Host ("{0}: {1} test codeunits expected ({2}..{3})" -f $s.name, $expected.Count, $expected[0], $expected[-1])
            "$($s.name)=$($app.FullName)" | Out-File (Join-Path $env:RUNNER_TEMP 'suite-apps.txt') -Append -Encoding utf8

            $out = Join-Path $env:GITHUB_WORKSPACE "xunit-$($s.name).xml"
            # Under the workspace: Run-TestsInBcContainer writes the file from inside the container, and
            # only the workspace is shared with it (run 39379151878: RUNNER_TEMP "is not shared with the container").
            $partsDir = Join-Path $env:GITHUB_WORKSPACE ".xunit-parts/$($s.name)"
            New-Item -ItemType Directory -Force -Path $partsDir | Out-Null
            [xml]$merged = '<?xml version="1.0" encoding="UTF-8"?><assemblies/>'
            $done = [System.Collections.Generic.HashSet[int]]::new()
            $aborted = @()
            $abortedInARow = 0
            $size = $chunkSize
            $call = 0
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Write-Host "::group::run $($s.name) ($($appJson.id))"
            while ($true) {
              $remaining = @($expected | Where-Object { -not $done.Contains($_) -and $aborted -notcontains $_ })
              if ($remaining.Count -eq 0) { break }
              $call++
              if ($call -gt 200) { Write-Host "::warning::$($s.name): stopped after 200 test runner calls"; break }
              $chunk = @($remaining | Select-Object -First $size)
              $chunkSet = [System.Collections.Generic.HashSet[int]]::new([int[]]$chunk)
              $blocked = [System.Collections.Generic.HashSet[int]]::new($blockedBase)
              foreach ($i in $expected) { if (-not $chunkSet.Contains($i)) { [void]$blocked.Add($i) } }
              $filter = ConvertTo-RangeFilter $chunk ([int[]]@($blocked | Sort-Object))
              $part = Join-Path $partsDir ("part-{0:d3}.xml" -f $call)
              Write-Host ("call {0}: {1} codeunit(s) from {2}, filter {3}" -f $call, $chunk.Count, $chunk[0], $filter)
              try {
                Run-TestsInBcContainer -containerName $c -credential $cred `
                  -extensionId $appJson.id -testCodeunitRange $filter `
                  -interactionTimeout ([timespan]::FromMinutes(10)) `
                  -culture $env:CULTURE -timezone $env:TIMEZONE `
                  -XUnitResultFileName $part -AzureDevOps 'no' -GitHubActions 'no' `
                  -detailed -returnTrueIfAllPassed | Out-Null
                $lastError = 'the test runner returned without a result for this codeunit'
              } catch {
                $lastError = $_.Exception.Message
                Write-Host "::warning::Run-TestsInBcContainer for $($s.name) (call $call, from $($chunk[0])) raised: $lastError"
              }
              $got = Get-ReportedIds $part
              $outside = @($got | Where-Object { -not $chunkSet.Contains($_) })
              if ($outside.Count) {
                throw "The codeunit range filter was not applied: call $call reported codeunits outside its chunk ($($outside[0..4] -join ', ')). Refusing to merge duplicate results."
              }
              if (Test-Path $part) {
                [xml]$px = [IO.File]::ReadAllText($part)
                foreach ($a in $px.SelectNodes('//assembly')) { [void]$merged.DocumentElement.AppendChild($merged.ImportNode($a, $true)) }
              }
              foreach ($i in $got) { [void]$done.Add($i) }
              # Progress: grow the chunk again. No result at all (the runner threw and lost its file,
              # or stopped on the first codeunit): halve it, down to the first codeunit alone; a
              # codeunit that reports nothing even alone is recorded as aborted and skipped.
              if ($got.Count -gt 0) {
                $size = [Math]::Min($chunkSize, $size * 2); $abortedInARow = 0
                if ($got.Count -lt $chunk.Count) { Write-Host "call $call stopped early after $($got.Count) of $($chunk.Count) codeunit(s); continuing with the rest"; Start-Sleep -Seconds 20 }
              } elseif ($chunk.Count -eq 1) {
                Write-Host "::warning::$($s.name): runner stop during codeunit $($chunk[0]); recorded as a failed codeunit, continuing with the next one"
                $aborted += $chunk[0]; $size = $chunkSize; $abortedInARow++
                # Recorded as ONE failed test of that codeunit, with the reason, so the results say
                # "runner stop" instead of leaving the codeunit out. The run goes on after it.
                $cuName = "$($info.names."$($chunk[0])")"
                $asm = $merged.CreateElement('assembly')
                foreach ($kv in @(@('name', "$($chunk[0]) $cuName"), @('test-framework', 'PS Test Runner'), @('total', '1'), @('passed', '0'), @('failed', '1'), @('skipped', '0'), @('time', '0'))) { $asm.SetAttribute($kv[0], $kv[1]) }
                $col = $merged.CreateElement('collection')
                foreach ($kv in @(@('name', $cuName), @('total', '1'), @('passed', '0'), @('failed', '1'), @('skipped', '0'), @('time', '0'))) { $col.SetAttribute($kv[0], $kv[1]) }
                $t = $merged.CreateElement('test')
                foreach ($kv in @(@('name', "${cuName}:RunnerStop_NoResult"), @('method', 'RunnerStop_NoResult'), @('time', '0'), @('result', 'Fail'))) { $t.SetAttribute($kv[0], $kv[1]) }
                $f = $merged.CreateElement('failure'); $m = $merged.CreateElement('message')
                $m.InnerText = "Runner stop: the test runner stopped during codeunit $($chunk[0]) and reported no result, also when it ran alone. Last error: $lastError"
                [void]$f.AppendChild($m); [void]$t.AppendChild($f); [void]$col.AppendChild($t); [void]$asm.AppendChild($col)
                [void]$merged.DocumentElement.AppendChild($asm)
                # Three codeunits in a row that report nothing even alone: the runner itself is broken
                # (setup, connection, container), not a codeunit. Stop instead of crawling through the app.
                if ($abortedInARow -ge 3) { throw "$($s.name): $abortedInARow codeunits in a row reported nothing ($($aborted[-3..-1] -join ', ')); the test runner is not working. Last error above." }
                Start-Sleep -Seconds 20
              } else {
                $size = [Math]::Max(1, [int][Math]::Floor($chunk.Count / 2))
                Write-Host "call $call reported nothing; retrying with $size codeunit(s)"; Start-Sleep -Seconds 20
              }
            }
            $merged.Save($out)
            "ABORTED_$($s.name -replace '-', '_')=$($aborted -join ',')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host ("$($s.name): {0} of {1} codeunits reported in {2} call(s), {3:n1} min" -f $done.Count, $expected.Count, $call, $sw.Elapsed.TotalMinutes)
            Write-Host "::endgroup::"
          }

          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'xunit-*.xml') |
            ForEach-Object { Write-Host ("{0}: {1:n0} KB" -f $_.Name, ($_.Length/1KB)) }

      # ---------------------------------------------------------------------------------
      # Isolation probe (first asked for in BusinessCentral.AL.Runner issue 4826; al-runtime-rs
      # reads its XUnit files as an oracle). ADDITIVE: it runs after the corpus, writes its own
      # XUnit files, never reaches the headline or the #213 comparison above, and cannot fail
      # the job (continue-on-error). ci.yml's Linux legs never compile this app.
      #
      # Why it is here and nowhere else: the corpus harness always runs under 130450
      # (TestIsolation = Codeunit), and a test cannot start a second test runner
      # (NavNCLTestCodeUnitNestedInvocationException). So what TestIsolation = Function resets
      # between [Test] methods can only be measured by a TOP-LEVEL custom runner, which is what
      # -testRunnerCodeunitId selects. 61300 is that runner; 61301 is the identical runner with
      # TestIsolation = Codeunit, as the control that shows the fixture's T5 can fail. The
      # per-test rows land in the summary via isolation-probe-results.py below.
      # ---------------------------------------------------------------------------------
      - name: Isolation probe -- compile, publish, run under two custom test runners
        id: isolation_probe
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module BcContainerHelper -DisableNameChecking
          $c = $env:CONTAINER_NAME
          $cred = Import-Clixml (Join-Path $env:RUNNER_TEMP 'bccred.xml')

          # Without this parameter the probe would silently run under the default runner
          # (130450) and report Codeunit isolation as Function isolation.
          if (-not (Get-Command Run-TestsInBcContainer).Parameters.ContainsKey('testRunnerCodeunitId')) {
            throw "Run-TestsInBcContainer has no -testRunnerCodeunitId in BcContainerHelper $env:BCCH_VERSION. Refusing to run the isolation probe under a runner it did not choose."
          }

          $folder = 'tests/al-language-isolation-probe'
          $outDir = Join-Path $env:GITHUB_WORKSPACE '.output'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          # The latest AL compiler on the host, not the container's (see "Install the latest AL compiler").
          $appFile = Compile-AppWithBcCompilerFolder -compilerFolder $env:BC_COMPILER_FOLDER `
            -appProjectFolder (Join-Path $env:GITHUB_WORKSPACE $folder) `
            -appOutputFolder $outDir `
            -appSymbolsFolder (Join-Path $outDir 'symbols') -failOn 'error'
          Publish-BcContainerApp -containerName $c -credential $cred `
            -appFile $appFile -skipVerification -sync -install

          $appJson = Get-Content (Join-Path $env:GITHUB_WORKSPACE "$folder/app.json") -Raw | ConvertFrom-Json
          # Function first: the SingleInstance mark T1 sets would otherwise already be there.
          $runs = @(
            @{ runner = '61300'; out = 'xunit-isolation-function.xml' },
            @{ runner = '61301'; out = 'xunit-isolation-codeunit.xml' }
          )
          foreach ($r in $runs) {
            Write-Host "::group::isolation probe under runner $($r.runner)"
            try {
              Run-TestsInBcContainer -containerName $c -credential $cred `
                -extensionId $appJson.id -testRunnerCodeunitId $r.runner `
                -culture $env:CULTURE -timezone $env:TIMEZONE `
                -XUnitResultFileName (Join-Path $env:GITHUB_WORKSPACE $r.out) `
                -AzureDevOps 'no' -GitHubActions 'no' `
                -detailed -returnTrueIfAllPassed | Out-Null
            } catch {
              Write-Host "::warning::isolation probe under runner $($r.runner) raised: $($_.Exception.Message)"
            }
            Write-Host "::endgroup::"
          }

      - name: Compare against issue #213
        if: always()
        shell: bash
        run: |
          python .github/scripts/bc-test-results.py \
            --xunit xunit-al-language.xml \
            --xunit xunit-al-language-onprem.xml \
            --baseline .github/expected-failures/issue-213-saas-sandbox.json \
            --environment environment.json \
            --outdir test-results

      - name: Isolation probe -- per-test rows
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python .github/scripts/isolation-probe-results.py \
            --fixture tests/al-language-isolation-probe/src/IsolProbeFixture.Codeunit.al \
            --run "TestIsolation = Function (runner 61300)=xunit-isolation-function.xml" \
            --run "TestIsolation = Codeunit control (runner 61301)=xunit-isolation-codeunit.xml" \
            --outdir test-results

      # Fails the job, loudly, when a test codeunit is silently missing: neither reported nor
      # recorded as a runner stop. It
      # runs after the comparison and before the upload, so the partial results still land in
      # the artifact. The counts and the highest id that reported go into the run summary.
      - name: Every test codeunit reported
        if: always() && steps.run_tests.outcome != 'skipped'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $list = Join-Path $env:RUNNER_TEMP 'suite-apps.txt'
          if (-not (Test-Path $list)) { throw "The run step recorded no test apps: no test codeunit was run." }
          $failed = 0
          "### Test codeunits that reported" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($line in Get-Content $list) {
            $name, $app = $line -split '=', 2
            $aborted = [Environment]::GetEnvironmentVariable("ABORTED_$($name -replace '-', '_')")
            & python (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/codeunit-coverage.py') check `
              --app $app --xunit (Join-Path $env:GITHUB_WORKSPACE "xunit-$name.xml") --name $name `
              --aborted "$aborted" --summary $env:GITHUB_STEP_SUMMARY
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed) { throw "$failed test app(s) did not report every test codeunit." }

      - name: Disk (after)
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
              @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.FreeSpace/1GB,1)}} | Format-Table -AutoSize

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows-bc${{ needs.gate.outputs.bc_version }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            xunit-*.xml
            test-results/**
            environment.json
            license-information.txt

      - name: Container logs on failure
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module BcContainerHelper -DisableNameChecking
          Get-BcContainerEventLog -containerName $env:CONTAINER_NAME -logname Application -ErrorAction SilentlyContinue
          docker logs $env:CONTAINER_NAME 2>&1 | Select-Object -Last 200

      - name: Remove the container
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module BcContainerHelper -DisableNameChecking
          Remove-BcContainer -containerName $env:CONTAINER_NAME -ErrorAction SilentlyContinue
